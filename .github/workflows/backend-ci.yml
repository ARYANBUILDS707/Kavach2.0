# Minimal backend CI (milestone M1.1): locked install, pytest and Ruff only.
# Actions are pinned to full commit SHAs; the comment names the release tag.
name: Backend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [backend, dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Verify lockfile matches pyproject.toml
        run: uv lock --check --project backend

      - name: Install locked dependencies
        id: install
        run: uv sync --project backend --locked

      - name: Run pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --project backend --locked pytest backend/tests

      - name: Run Ruff lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --project backend --locked ruff check backend --output-format=github

      - name: Run Ruff format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --project backend --locked ruff format --check backend
