[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kavach-backend"
version = "0.1.0"
description = "KAVACH V4 backend foundation for controlled fraud-analysis research"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kavach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
