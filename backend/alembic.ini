# Alembic configuration for the KAVACH schema (M2.2).
# The connection URL is never stored here: env.py reads MIGRATION_DATABASE_URL
# (the migration-owner role) from the environment.
[alembic]
script_location = %(here)s/src/kavach/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
